[project]
name = "tiny-agent"
version = "0.3.0"
description = "Zero-dependency agent framework — like LangChain, but in one file."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hussain Al-Saibai", email = "hussain.alsaibai@gmail.com"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = ["ai", "agent", "llm", "autonomous", "react", "tool", "mcp"]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-agent"
Repository = "https://github.com/hussain-alsaibai/tiny-agent"
Documentation = "https://github.com/hussain-alsaibai/tiny-agent#readme"
Changelog = "https://github.com/hussain-alsaibai/tiny-agent/blob/main/CHANGELOG.md"
Issues = "https://github.com/hussain-alsaibai/tiny-agent/issues"
"Bug Tracker" = "https://github.com/hussain-alsaibai/tiny-agent/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
all = [
    "openai>=1.0",
    "anthropic>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiny_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = ["slow", "integration", "unit"]

[tool.coverage.run]
source = ["tiny_agent"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
